Name: bankchannel.rpc
ListenOn: 0.0.0.0:8080
Timeout: 10000
# 关闭服务端熔断(其它中间件保持默认开启)
Middlewares:
  Breaker: false
  Shedding: false # 关闭自适应降载（service overloaded，不是熔断，一并关掉）
CpuThreshold: 0 # 0 关闭CPU过载降载兜底保护

Etcd:
  Hosts:
    - etcd:2379  # etcd 集群节点1
    - etcd2:2379 # etcd 集群节点2, 任一节点可用即可
    - etcd3:2379 # etcd 集群节点3
    # - 127.0.0.1:2379 # 本地直接运行
    # - etcd-0.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-1.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-2.etcd.pay-ns.svc.cluster.local:2379
  Key: bankchannel.rpc

TradeIdMgrRpcConfig:
  NonBlock: true  # 非阻塞连接，etcd中服务未注册时不阻塞启动，调用时再报错
  Etcd:
    Hosts:
    - etcd:2379   # etcd 集群节点1
    - etcd2:2379  # etcd 集群节点2, 任一节点可用即可发现服务
    - etcd3:2379  # etcd 集群节点3
    Key: tradeidmgr.rpc  # 注册到etcd的服务key，客户端要对应这个key
  Timeout: 10000  # 超时时间，单位毫秒
  Middlewares:
    Breaker: false  # 关闭客户端熔断

# Prometheus 指标采集：go-zero 会另起一个独立 HTTP 端口暴露 /metrics
Prometheus:
  Host: 0.0.0.0
  Port: 9090
  Path: /metrics

# 链路追踪：go-zero 通过 OTLP 协议发送 trace 到 Tempo
Telemetry:
  Name: bank_channel
  Endpoint: tempo:4318
  Batcher: otlphttp
  Sampler: 1.0

# AccessLog: 请求/响应日志记录(按字段名脱敏)
AccessLog:
  Enable: true
  SensitiveFields:
    - password
    - user_token
    - old_password
    - new_password
    - pay_password
